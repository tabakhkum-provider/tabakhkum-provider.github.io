body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

.big{font-size:26px;font-weight:800}

.cal .t{outline:2px solid var(--ok)}
a{color:#38bdf8}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border-bottom:0}

function forgotFlow(box,wa,done,back){
 var rid=null,tok=null,iv=0,dead=false,t0=0,busy=false;
 var CODE_ST='font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;direction:ltr;margin:14px 0;color:var(--gold2,#c9a24a)';
 function stop(){dead=true;clearInterval(iv)}
 box.__stop=stop;
 function say(h){if(!dead)box.innerHTML=h}
 function q(i){return box.querySelector('#'+i)}
 function s1(){
  clearInterval(iv);rid=null;tok=null;
  say('<h3>نسيت كلمة السر</h3><div class="mu" style="line-height:1.9;margin:8px 0">اكتب رقم موبايلك المسجل بحسابك (لازم يكون موثق). نعطيك رمز ترسله بواتساب من نفس الرقم، بعدها تكدر تغير كلمة السر بنفسك.</div><input id="fgp" type="tel" inputmode="numeric" maxlength="11" placeholder="07xxxxxxxxx" autocomplete="tel"><button class="btn" id="fgg">متابعة</button><button class="btn sec" id="fgb">رجوع</button>');

   var p=ad(q('fgp').value).replace(/[\s\-]/g,'');
   if(!/^07[5789][0-9]{8}$/.test(p))return toast('رقم الموبايل لازم يكون 11 رقم ويبدأ بـ 075 أو 077 أو 078 أو 079',4500);
   if(busy)return;busy=true;ev.target.disabled=true;
   try{
    var r=await sb.rpc('pw_reset_start',{p_phone:p});
    if(r.error)throw r.error;
    var d=Array.isArray(r.data)?r.data[0]:r.data;
    if(!d||!d.rid||!d.code||!d.token)throw new Error('صار خطأ، جرب مرة ثانية');
    rid=d.rid;tok=d.token;s2(d.code)
   }catch(e){toast((e&&e.message)||'صار خطأ، جرب مرة ثانية',4500);if(!dead)ev.target.disabled=false}
   finally{busy=false}
  };
 }
 function s2(code){
  var href='https://wa.me/'+encodeURIComponent(wa)+'?text='+encodeURIComponent('رمز الاسترجاع: '+code);
  t0=Date.now();
  say('<h3>أرسل الرمز بواتساب</h3><div class="mu" style="line-height:1.9">اضغط الزر وأرسل الرسالة كما هي من نفس رقمك المسجل. بعد ما تنرسل ينفتح لك تغيير كلمة السر تلقائياً.</div><div style="'+CODE_ST+'">'+esc(code)+'</div><a class="btn" style="text-decoration:none;display:block;text-align:center" target="_blank" rel="noopener" href="'+esc(href)+'">فتح واتساب وإرسال الرمز</a><div class="mu" style="line-height:1.8;margin-top:10px;color:#c0392b">لا ترسل هذا الرمز لأي شخص، ولا ترسله إذا ما طلبته أنت.</div><div id="fgh" class="mu" style="line-height:1.8;margin-top:8px"></div><button class="btn sec" id="fgx">إلغاء</button>');

   if(dead||busy)return;

   if(el>600000){clearInterval(iv);say('<h3>انتهى الوقت</h3><div class="mu" style="margin:8px 0">انتهت مدة الرمز. ابدأ من جديد.</div><button class="btn" id="fgr">ابدأ من جديد</button>');q('fgr').onclick=s1;return}

   }catch(e){}

 }

   say('<h3>صار خطأ</h3><div class="mu" style="margin:8px 0">'+esc((e&&e.message)||'جرب مرة ثانية')+'</div><button class="btn" id="fgr">ابدأ من جديد</button>');q('fgr').onclick=s1;
  }
 }
 function s3(){

 }
 s1();

function shell(){
 var offered=ORD.filter(function(x){return x.state==='offered'}).length+OFF.length;
 app.innerHTML='<div class="top"><div><b>'+esc(ME.name)+'</b><div class="mu">'+esc(ME.active?(TABN[ME.tab]||''):'حسابك موقوف')+'</div></div><div class="sw"><span id="st">'+(ME.online?'تشغيل':'إطفاء')+'</span><button class="tg'+(ME.online?' on':'')+'" id="tg" aria-label="تشغيل أو إطفاء"></button></div></div><div class="w" id="body"></div><div class="nav"><button data-t="orders">الطلبات'+(offered?'<span class="dot">'+offered+'</span>':'')+'</button><button data-t="cal">الجدول</button><button data-t="earn">الأرباح</button><button data-t="prof">حسابي</button></div>';
 document.getElementById('tg').onclick=async function(ev){
  var want=!ME.online;ev.target.disabled=true;
  try{await Q(sb.rpc('provider_set_online',{p_on:want}));ME.online=want;await loadAll(true);shell();render();toast(want?'صرت تشغيل: توصلك الطلبات':'صرت إطفاء: ما توصلك طلبات جديدة')}catch(e){toast(errMsg(e))}finally{ev.target.disabled=false}
 };
 var bs=app.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){TAB=this.getAttribute('data-t');shell();render();if(TAB==='earn')loadHist(true);if(TAB==='prof')loadProf()};
 for(var j=0;j<bs.length;j++)if(bs[j].getAttribute('data-t')===TAB)bs[j].className='on';
}
function render(){
 var b=document.getElementById('body');if(!b)return;
 if(TAB==='orders')b.innerHTML=vOrders();else if(TAB==='cal')b.innerHTML=vCal();else if(TAB==='prof')b.innerHTML=vProf();else b.innerHTML=vEarn();
 bind(b);if(TAB==='prof')instBind();
}
function hl(h){h=Number(h);var hh=h%24;var x=hh===0?'12 منتصف الليل':hh<12?hh+' صباحاً':hh===12?'12 ظهراً':(hh-12)+' مساءً';return h>24?x+' بعد منتصف الليل':x}
function items(l){l=l||[];var d=0;var t=l.map(function(x){if(x.days>d)d=x.days;return esc(x.name)+(x.from!=null&&x.to!=null?' ('+hl(x.from)+' - '+hl(x.to)+')':' × '+esc(x.qty))}).join('، ');return t+(d>1?' - لمدة '+d+' أيام':'')}
function vOrders(){
 var h='';
 var nAcc=ORD.filter(function(x){return x.state==='accepted'&&x.status!=='delivered'}).length,nNew=ORD.filter(function(x){return x.state==='offered'}).length+OFF.length;
 h+='<div class="st3"><div class="card"><div class="mu">جديدة</div><div class="big">'+nNew+'</div></div><div class="card"><div class="mu">مقبولة</div><div class="big">'+nAcc+'</div></div><div class="card"><div class="mu">أجرة قادمة</div><div style="font-size:15px;font-weight:800;margin-top:6px">'+money(PEND)+'</div></div></div><button class="btn sec s" data-rf="1">تحديث الآن</button>';
 if(!ME.online)h+='<div class="off-note">أنت مطفأ. الطلبات الجديدة ما تظهر لك. شغّل المفتاح فوق لما تكون جاهز.</div>';
 var off=ORD.filter(function(x){return x.state==='offered'}),offs=OFF,acc=ORD.filter(function(x){return x.state==='accepted'&&x.status!=='delivered'}),done=ORD.filter(function(x){return x.state==='accepted'&&x.status==='delivered'});
 h+='<h2>طلبات جديدة ('+(off.length+offs.length)+')</h2>';
 h+=offs.map(function(o){return '<div class="card" data-id="'+o.booking_id+'" data-d="'+esc(dstr(o.event_date))+'" data-open="1"><span class="tag new">متاح للجميع</span> <b>'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+'</b><div class="mu" style="margin:6px 0">'+esc(dname(o.event_date))+'<br>المنطقة: '+esc(o.area||'')+'<br>'+items(o.items)+'</div><div>أجرتك: <span class="big">'+money(o.pay)+'</span></div><div class="mu">أول مقدم يقبل ياخذه</div><div class="row"><button class="btn ok" data-a="1">قبول</button><button class="btn sec" data-a="0">تجاهل</button></div></div>'}).join('');
 h+=off.length?off.map(function(o){return '<div class="card" data-id="'+o.booking_id+'" data-d="'+esc(dstr(o.event_date))+'"><span class="tag new">جديد</span> <b>'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+'</b><div class="mu" style="margin:6px 0">'+esc(dname(o.event_date))+'<br>المنطقة: '+esc(o.area||'')+'<br>'+items(o.items)+'</div><div>أجرتك: <span class="big">'+money(o.pay)+'</span></div><div class="row"><button class="btn ok" data-a="1">قبول</button><button class="btn bad" data-a="0">رفض</button></div></div>'}).join(''):(offs.length?'':'<div class="empty">ما كو طلبات جديدة</div>');
 h+='<h2>طلباتي المقبولة ('+acc.length+')</h2>';
 h+=acc.length?acc.map(function(o){var map=(o.lat!=null&&o.lng!=null)?'<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+Number(o.lat)+','+Number(o.lng)+'">فتح الخريطة</a>':'';return '<div class="card"><span class="tag ok">مقبول</span> <b>'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+'</b><div class="mu" style="margin:6px 0">'+esc(dname(o.event_date))+'<br>الزبون: '+esc(o.cust_name||'')+'<br>العنوان: '+esc(o.address||o.area||'')+' '+map+'<br>'+items(o.items)+'</div><div>أجرتك: <b>'+money(o.pay)+'</b></div>'+supBtn(o)+'</div>'}).join(''):'<div class="empty">ما كو طلبات مقبولة</div>';
 if(done.length){h+='<h2>تم تقديمها</h2>'+done.slice(0,10).map(function(o){return '<div class="card"><b>'+esc(occ(o.occasion))+'</b> <span class="mu">'+esc(dstr(o.event_date))+'</span> - '+money(o.pay)+'</div>'}).join('')}
 return h;
}
function supBtn(o){var w=SUP.wa;if(!w)return '';return '<a class="btn sec s" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/'+esc(w)+'?text='+encodeURIComponent('بخصوص الطلب '+String(o.booking_id).slice(0,8))+'">تواصل مع الإدارة بخصوص هذا الطلب</a>'}
function vCal(){
 var y=MONTH.getFullYear(),m=MONTH.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+1)%7;
 var jobs={};ORD.forEach(function(o){if(o.state==='accepted'&&o.event_date){var k=dstr(o.event_date);jobs[k]=(jobs[k]||0)+1}});
 var tdy=new Date(),ts=tdy.getFullYear()+'-'+String(tdy.getMonth()+1).padStart(2,'0')+'-'+String(tdy.getDate()).padStart(2,'0');
 var g='',names=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
 names.forEach(function(n){g+='<div class="h">'+n+'</div>'});
 for(var i=0;i<start;i++)g+='<div></div>';
 for(var d=1;d<=days;d++){var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');g+='<div class="'+(jobs[k]?'j':'')+(k===ts?' t':'')+'">'+d+'</div>'}
 var mn=first.toLocaleDateString('ar-IQ',{month:'long',year:'numeric'});
 var up=ORD.filter(function(o){return o.state==='accepted'&&o.status!=='delivered'&&dstr(o.event_date)>=ts}).sort(function(a,b){return dstr(a.event_date)<dstr(b.event_date)?-1:1});
 return '<div class="row" style="align-items:center"><button class="btn sec" data-m="1">&rarr; التالي</button><b style="text-align:center">'+esc(mn)+'</b><button class="btn sec" data-m="-1">السابق &larr;</button></div><div class="cal">'+g+'</div><p class="mu">الأيام البرتقالية: عندك طلب. الأخضر: اليوم.</p><h2>القادمة</h2>'+(up.length?up.map(function(o){return '<div class="card"><b>'+esc(dname(o.event_date))+'</b><div class="mu">'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+' | '+esc(o.area||'')+'</div></div>'}).join(''):'<div class="empty">ما كو أيام محجوزة</div>');
}
function vEarn(){
 var cur=new Date(),k=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'),t=0,j=0;
 EARN.forEach(function(e){if(e.month===k){t=Number(e.total);j=Number(e.jobs)}});
 return '<div class="card"><div class="mu">أرباح هذا الشهر</div><div class="big" style="color:var(--ok)">'+money(t)+'</div><div class="mu">'+j+' طلب تم تقديمه</div></div><div class="card"><div class="mu">مستحقات طلبات لسه ما انتهت</div><div class="big">'+money(PEND)+'</div></div><h2>الأشهر السابقة</h2>'+(EARN.length?EARN.map(function(e){return '<div class="card row"><b>'+esc(e.month)+'</b><span>'+Number(e.jobs)+' طلب</span><b>'+money(e.total)+'</b></div>'}).join(''):'<div class="empty">ما كو أرباح بعد</div>')+'<p class="mu">الأجرة تُحسب بعد ما تنتهي الخدمة وتأكدها الإدارة.</p><h2>سجل الطلبات المنجزة</h2>'+(HIST.length?HIST.map(function(x){return '<div class="card"><div class="kv"><b>'+esc(occ(x.occasion))+(x.meal?' - '+esc(meal(x.meal)):'')+'</b><b>'+money(x.pay)+'</b></div><div class="mu">'+esc(dname(x.event_date))+'</div>'+(x.stars!=null?'<div style="margin-top:6px">تقييم الزبون: <b>'+Number(x.stars)+' من 5</b></div>':'<div class="mu" style="margin-top:6px">ما كو تقييم</div>')+(x.note?'<div class="mu" style="margin-top:4px">'+esc(x.note)+'</div>':'')+'</div>'}).join('')+(HMORE?'<button class="btn sec s" data-more="1">عرض المزيد</button>':''):'<div class="empty">ما كو طلبات منجزة بعد</div>');
}
function tgRow(k,d,t,sub){return '<div class="kv"><div>'+t+'<small>'+sub+'</small></div><button class="tg'+(on(k,d)?' on':'')+'" data-k="'+k+'" aria-label="'+t+'"></button></div>'}
function vProf(){
 var p=PROF;if(!p)return '<div class="empty">جاري التحميل...</div>';
 var since='';try{since=new Date(p.created_at).toLocaleDateString('ar-IQ',{month:'long',year:'numeric'})}catch(e){}
 var rt=Number(p.stars_cnt)>0?'<b>'+Number(p.stars_avg)+' من 5</b> <span class="mu">('+Number(p.stars_cnt)+' تقييم)</span>':'<span class="mu">ما كو تقييمات بعد</span>';
 var h='<div class="card"><h2 style="margin-top:0">'+esc(p.name)+'</h2><div class="kv"><span>الخدمة</span><b>'+esc(TABN[p.tab]||p.tab||'')+'</b></div><div class="kv"><span>التقييم</span><span>'+rt+'</span></div><div class="kv"><span>طلبات منجزة</span><b>'+Number(p.jobs_done)+'</b></div><div class="kv"><span>مجموع الأرباح</span><b>'+money(p.total_earned)+'</b></div><div class="kv"><span>معنا من</span><span>'+esc(since)+'</span></div></div>';
 h+='<div class="card"><h2 style="margin-top:0">بياناتي</h2><label>رقم الهاتف</label><input id="pph" type="tel" inputmode="numeric" maxlength="11" value="'+esc(p.phone||'')+'"><label>المنطقة</label><input id="par" maxlength="60" value="'+esc(p.area||'')+'"><button class="btn" id="psave">حفظ</button></div>';
 h+='<div class="card"><h2 style="margin-top:0">التنبيهات</h2>'+tgRow('snd',true,'صوت واهتزاز','عند وصول طلب جديد')+tgRow('sys',false,'إشعار على الجهاز','يظهر حتى لو التطبيق بالخلفية')+tgRow('awake',false,'إبقاء الشاشة شغالة','حتى تصلك الطلبات فوراً')+'<p class="mu">التنبيهات تشتغل وأنت فاتح التطبيق أو هو بالخلفية. إذا سكّرته كلياً ما توصلك.</p></div>';
 if(SUP.wa)h+='<a class="btn sec" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/'+esc(SUP.wa)+'">تواصل مع الإدارة (واتساب)</a>';
 [SUP.support_phone,SUP.support_phone2].forEach(function(n){if(n)h+='<a class="btn sec" style="text-decoration:none;text-align:center" href="tel:'+esc(n)+'">اتصال بالإدارة '+esc(n)+'</a>'});
 return h+instHtml()+'<button class="btn bad" id="plo">تسجيل خروج</button>';
}
function bind(b){
 b.onclick=async function(e){
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(a){
   var card=a.closest('[data-id]'),id=card.getAttribute('data-id'),acc=a.getAttribute('data-a')==='1',open=card.getAttribute('data-open')==='1',dd=card.getAttribute('data-d')||'';
   if(acc&&dd&&ORD.some(function(x){return x.state==='accepted'&&x.status!=='delivered'&&dstr(x.event_date)===dd&&String(x.booking_id)!==id})&&!confirm('عندك طلب مقبول بنفس اليوم. تريد تقبل هذا بعد؟'))return;
   if(!acc&&!open&&!confirm('ترفض هذا الطلب؟ ما راح يوصل لغيرك من تلقائي، الإدارة تقرر.'))return;
   a.disabled=true;
   try{await Q(sb.rpc(open?'provider_take_offer':'provider_respond',{p_id:id,p_accept:acc}));toast(acc?'تم قبول الطلب':(open?'تم التجاهل':'تم الرفض'));await loadAll(true);shell();render()}catch(x){toast(errMsg(x),3500);a.disabled=false}
   return;
  }
  var rf=e.target.closest&&e.target.closest('[data-rf]');
  if(rf){rf.disabled=true;try{await loadAll(false);toast('تم التحديث',1200)}finally{rf.disabled=false}return}
  var mo=e.target.closest&&e.target.closest('[data-more]');
  if(mo){mo.disabled=true;await loadHist(false);return}
  var k=e.target.closest&&e.target.closest('[data-k]');
  if(k){var key=k.getAttribute('data-k'),nv=!on(key,key==='snd');
   if(key==='sys'&&nv){
    if(!('Notification' in window)){toast('جهازك ما يدعم الإشعارات');return}
    var pm=Notification.permission;if(pm==='default'){try{pm=await Notification.requestPermission()}catch(x){}}
    if(pm!=='granted'){toast('ما انسمح بالإشعارات من إعدادات المتصفح',3500);return}
   }
   CFG[key]=nv;cfgSave();if(key==='awake')wake();render();return}
  if(e.target.id==='psave'){var bt=e.target;bt.disabled=true;
   try{await Q(sb.rpc('provider_update_profile',{p_phone:ad(document.getElementById('pph').value),p_area:document.getElementById('par').value}));toast('تم الحفظ');await loadProf()}catch(x){toast(errMsg(x),3500)}finally{bt.disabled=false}return}
  if(e.target.id==='plo'){logout();return}
  var m=e.target.closest&&e.target.closest('[data-m]');
  if(m){MONTH=new Date(MONTH.getFullYear(),MONTH.getMonth()+Number(m.getAttribute('data-m')),1);render()}
 };
}

/* ---------- زر الرجوع ---------- */
var BK=0;
function guard(){try{history.pushState({p:1},'')}catch(e){}}
window.addEventListener('popstate',function(){
 if(Date.now()<BK)return history.back();
 BK=Date.now()+2200;toast('اضغط رجوع مرة ثانية للخروج',2000);guard();
});

/* ---------- تشغيل ---------- */
async function boot(){
 try{
  var s=await sb.auth.getSession();
  if(!s||!s.data||!s.data.session)return viewLogin();
  await loadMe();
  if(!ME)return viewCode();
  if(!ME.active){app.innerHTML='<div class="w"><h1>حسابك موقوف</h1><p class="mu">تواصل مع الإدارة.</p><button class="btn sec" id="out">تسجيل خروج</button></div>';document.getElementById('out').onclick=logout;return}
  LAST=0;shell();await loadSup();await loadAll(true);shell();render();wake();
  clearInterval(TM);TM=setInterval(function(){loadAll(false)},20000);
 }catch(e){app.innerHTML='<div class="w"><div class="empty">'+esc(errMsg(e))+'</div><button class="btn" id="rt">إعادة المحاولة</button></div>';document.getElementById('rt').onclick=boot}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ME){loadAll(false);wake()}});
window.addEventListener('online',function(){if(ME)loadAll(true)});
if(!sb){app.innerHTML='<div class="w"><div class="empty">تعذر تحميل التطبيق، تأكد من الإنترنت وحدّث الصفحة</div></div>'}else{guard();boot()}
function showUpd(){if(document.getElementById('sbar'))return;var d=document.createElement('div');d.className='sbar';d.id='sbar';d.innerHTML='<span>صار تحديث للتطبيق</span><button id="sbu">تحديث</button><button class="x" id="sbn">إلغاء</button>';document.body.appendChild(d);document.getElementById('sbu').onclick=function(){location.reload()};document.getElementById('sbn').onclick=function(){d.remove()}}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){var hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl)showUpd()});window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}}catch(e){}
})();
</script>
